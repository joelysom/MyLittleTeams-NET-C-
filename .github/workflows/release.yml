name: Release desktop build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MeuApp.csproj

      - name: Test
        run: dotnet test MeuApp.Tests/MeuApp.Tests.csproj --configuration Release

      - name: Publish Windows app
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $parts = $version.Split(".")
          $assemblyVersion = if ($parts.Count -eq 4) { $version } else { "$version.0" }

          dotnet publish MeuApp.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish\win-x64 `
            -p:Version=$version `
            -p:AssemblyVersion=$assemblyVersion `
            -p:FileVersion=$assemblyVersion `
            -p:InformationalVersion=$version

      - name: Package release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path publish\win-x64\* -DestinationPath "artifacts\Choas-${{ github.ref_name }}-win-x64.zip" -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
